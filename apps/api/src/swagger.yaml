  /v1/work-sessions/{id}/chat:
    post:
      summary: Send chat message and get TA response
      tags:
        - work-sessions
      description: >-
        Sends a user message to the Teaching Assistant via OpenRouter, saves the
        interaction, and returns the AI response
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 10000
                code:
                  type: string
                stdin:
                  type: string
                stdout:
                  type: string
              required:
                - message
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      modelResponse:
                        type: string
                      interactionId:
                        type: string
                    required:
                      - modelResponse
                      - interactionId
                    additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      total:
                        type: number
                      page:
                        type: number
                      perPage:
                        type: number
                      totalPages:
                        type: number
                    required:
                      - total
                      - page
                      - perPage
                      - totalPages
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        '400':
