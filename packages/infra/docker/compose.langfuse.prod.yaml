# Langfuse v3 production self-hosted stack
# Deploy on a Docker host (VPS, Azure VM, etc.)
#
# Required environment variables (set in the host environment or a .env file):
#   LANGFUSE_POSTGRES_PASSWORD    - strong random password for the Langfuse DB user
#   LANGFUSE_NEXTAUTH_SECRET      - random string >= 32 chars (openssl rand -hex 32)
#   LANGFUSE_SALT                 - random string >= 32 chars (openssl rand -hex 32)
#   LANGFUSE_ENCRYPTION_KEY       - 64-char hex string        (openssl rand -hex 32)
#   LANGFUSE_CLICKHOUSE_PASSWORD  - strong random password for ClickHouse
#   LANGFUSE_HOSTNAME             - public hostname, e.g. langfuse.example.com
#   LANGFUSE_INIT_USER_EMAIL      - email for the seed admin account
#   LANGFUSE_INIT_USER_PASSWORD   - password for the seed admin account
#   LANGFUSE_INIT_PROJECT_PUBLIC_KEY  - project public key  (pk-lf-...)
#   LANGFUSE_INIT_PROJECT_SECRET_KEY  - project secret key  (sk-lf-...)
#
# Start:   docker compose -p langfuse_prod -f compose.langfuse.prod.yaml up -d
# Stop:    docker compose -p langfuse_prod -f compose.langfuse.prod.yaml stop
# Destroy: docker compose -p langfuse_prod -f compose.langfuse.prod.yaml down -v

services:
  langfuse_postgres:
    image: "postgres:16-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_POSTGRES_PASSWORD}"
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse_clickhouse:
    image: "clickhouse/clickhouse-server:24.8-alpine"
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DB: default
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse_server:
    image: "langfuse/langfuse:3"
    restart: unless-stopped
    depends_on:
      langfuse_postgres:
        condition: service_healthy
      langfuse_clickhouse:
        condition: service_healthy
    ports:
      - "3200:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse_postgres:5432/langfuse"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse_clickhouse:9000"
      CLICKHOUSE_URL: "http://langfuse_clickhouse:8123"
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD}"
      NEXTAUTH_URL: "https://${LANGFUSE_HOSTNAME}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET}"
      SALT: "${LANGFUSE_SALT}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY}"
      LANGFUSE_INIT_ORG_ID: "taco-ide-org"
      LANGFUSE_INIT_ORG_NAME: "TACO-IDE"
      LANGFUSE_INIT_PROJECT_ID: "taco-ide-project"
      LANGFUSE_INIT_PROJECT_NAME: "TACO-IDE"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL}"
      LANGFUSE_INIT_USER_NAME: "Admin"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
