services:
  database_taco_ide:
    image: "postgres:16.0-alpine3.18"
    env_file:
      - ../../../apps/api/.env.development
    ports:
      - "5490:5432"

  agents:
    build:
      context: ../../../apps/agents
      dockerfile: Dockerfile
    env_file:
      - ../../../apps/agents/.env
    ports:
      - "8888:8888"
    depends_on:
      - database_taco_ide
    profiles:
      - agents
