name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taco_ci_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d taco_ci_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taco_ci_e2e
      BETTER_AUTH_SECRET: ci-only-local-auth-secret-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:4001
      NEXT_PUBLIC_API_URL: http://localhost:4000
      E2E_API_URL: http://localhost:4000
      E2E_FRONTEND_URL: http://localhost:4001
      E2E_USE_BUILD: "true"
      PORT: "4000"
      LLM_API_KEY: ci-dummy-key
      LLM_API_BASE: http://127.0.0.1:9/v1/
      EMBEDDING_API_URL: http://127.0.0.1:9/v1/embeddings
      CODE_EXEC_API_URL: http://127.0.0.1:9/execute
      LANGFUSE_ENABLED: "false"
      RESEND_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.3.0
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run API tests in the isolated test database
        run: npm test
      - name: Prepare the browser-test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          npm run db:migrate --workspace=@repo/infra
          npm run db:push --workspace=@repo/infra
          npm run db:seed:dev --workspace=@repo/infra
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload browser report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
