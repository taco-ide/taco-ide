openapi: 3.0.3
info:
  title: TACO-IDE API
  description: Backend API for TACO-IDE educational platform
  version: 1.0.0
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas: {}
paths:
  /api/auth/{*}:
    get: &ref_0
      parameters:
        - schema:
            type: string
          in: path
          name: '*'
          required: true
      responses:
        '200':
          description: Default Response
    head: *ref_0
    trace: *ref_0
    delete: *ref_0
    options: *ref_0
    patch: *ref_0
    put: *ref_0
    post: *ref_0
  /v1/auth/{*}:
    get: &ref_1
      parameters:
        - schema:
            type: string
          in: path
          name: '*'
          required: true
      responses:
        '200':
          description: Default Response
    head: *ref_1
    trace: *ref_1
    delete: *ref_1
    options: *ref_1
    patch: *ref_1
    put: *ref_1
    post: *ref_1
  /v1/status:
    get:
      summary: Health check endpoint
      tags:
        - status
      description: Returns the API health status and uptime
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  timestamp:
                    type: string
                  uptime:
                    type: number
                required:
                  - success
                  - message
                  - timestamp
                  - uptime
                additionalProperties: false
  /v1/users/me:
    get:
      summary: Get current authenticated user data
      tags:
        - users
      description: Returns the profile of the currently authenticated user
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      emailVerified:
                        type: boolean
                      isActive:
                        type: boolean
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                    required:
                      - id
                      - email
                      - name
                      - emailVerified
                      - isActive
                      - createdAt
                      - updatedAt
                    additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      total:
                        type: number
                      page:
                        type: number
                      perPage:
                        type: number
                      totalPages:
                        type: number
                    required:
                      - total
                      - page
                      - perPage
                      - totalPages
                    additionalProperties: false
                required:
                  - success
                  - data
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      anyOf:
                        - type: array
                          items:
                            type: string
                        - type: string
                required:
                  - success
                  - message
                additionalProperties: false
  /v1/challenges/:
    get:
      summary: List challenges
      tags:
        - challenges
      description: >-
        List challenges. scope=mine: from user's associations; scope=public: no
        association; scope=all: both.
      parameters:
        - schema:
            type: string
            enum:
              - mine
              - public
              - all
            default: all
          in: query
          name: scope
          required: false
        - schema:
            type: string
            enum:
              - easy
              - medium
              - hard
          in: query
          name: difficulty
          required: false
        - schema:
            type: string
          in: query
          name: tags
          required: false
        - schema:
            type: number
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
        - schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: perPage
          required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                          nullable: true
                        difficulty:
                          type: string
                          nullable: true
                        tags:
                          type: array
                          items:
                            type: string
                          nullable: true
                        author:
                          type: string
                          nullable: true
                        classroomTitle:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                      required:
                        - id
                        - title
                        - description
                        - difficulty
                        - tags
                        - author
                        - classroomTitle
                        - createdAt
                      additionalProperties: false
                  pagination:
                    type: object
                    properties:
                      total:
                        type: number
                      page:
                        type: number
                      perPage:
                        type: number
                      totalPages:
                        type: number
                    required:
                      - total
                      - page
                      - perPage
                      - totalPages
                    additionalProperties: false
                required:
                  - success
                  - data
                  - pagination
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - false
                  message:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      anyOf:
                        - type: array
                          items:
                            type: string
                        - type: string
                required:
                  - success
                  - message
                additionalProperties: false
