services:
  database_taco_ide:
    image: "postgres:16.0-alpine3.18"
    env_file:
      - ../../../apps/api/.env.development
    ports:
      - "5490:5432"
    networks:
      - taco_network

  ai_service:
    build:
      context: ../../../apps/ai-service
      dockerfile: Dockerfile
    container_name: taco_ai_service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ../../../apps/ai-service/src:/app/src:ro
    networks:
      - taco_network

  # --- Ollama Profile: Local CPU/GPU inference ---
  # Usage: npm run services:up:ollama
  ollama:
    image: ollama/ollama:latest
    container_name: taco_ollama
    profiles:
      - ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - taco_network

  ai_service_ollama:
    build:
      context: ../../../apps/ai-service
      dockerfile: Dockerfile
    container_name: taco_ai_service_ollama
    profiles:
      - ollama
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=ollama
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${OLLAMA_MODEL:-llama3.2}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - ollama
    networks:
      - taco_network

  # --- vLLM Profile: GPU high-performance inference ---
  # Requires: NVIDIA GPU + nvidia-container-toolkit
  # Usage: npm run services:up:vllm
  vllm:
    image: vllm/vllm-openai:v0.6.6
    container_name: taco_vllm
    profiles:
      - vllm
    ports:
      - "8001:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    command: ["--model", "${VLLM_MODEL:-meta-llama/Llama-3.2-1B-Instruct}", "--dtype", "auto"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - vllm_cache:/root/.cache/huggingface
    networks:
      - taco_network

  ai_service_vllm:
    build:
      context: ../../../apps/ai-service
      dockerfile: Dockerfile
    container_name: taco_ai_service_vllm
    profiles:
      - vllm
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=vllm
      - LLM_BASE_URL=http://vllm:8000/v1
      - LLM_MODEL=${VLLM_MODEL:-meta-llama/Llama-3.2-1B-Instruct}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - vllm
    networks:
      - taco_network

networks:
  taco_network:
    driver: bridge

volumes:
  ollama_data:
  vllm_cache:
